<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria</title>
    <script src="./login.js" defer></script>
    <link rel="stylesheet" href="./login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.18.0/dist/axios.min.js"></script>

</head>

<body class="body" id="body">
    <header class="header" id="header">
        <h1>Veterinaria TucuPet</h1>
        <h2>Servicios veterinarios a domicilio</h2>
    </header>

    <main class="main" id="main">
        <form action="" class="login-form" id="form-principal">
            <label for="email">Correo</label>
            <input type="email" id="email" required>
            <br>
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" required>
            <br>
            <button type="submit" class="btn btn-primary" id="btn-iniciarsesion">Iniciar sesión</button>
            <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
        </form>
    </main>
    <footer class="footer" id="footer">
        <p>&copy; Todos los Derechos reservados 2026</p>
    </footer>
</body>

</html>
