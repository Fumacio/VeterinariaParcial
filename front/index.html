<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria TucuPet</title>
    <link rel="stylesheet" href="./login.css"> <!-- esta puesto el de login, ya esta creado el de index solo q me dio pajita -->


    <script src="https://cdn.jsdelivr.net/npm/axios@1.18.0/dist/axios.min.js"></script>
</head>

<body>
    <header>
        <h1>Veterinaria TucuPet</h1>
        <h2>Tienda online para Mascotas</h2>
        <!-- esto del style del button iria en el css 💀 jajaja me acorde como poner emojis
        cuando leas esto transferime 1 peso a mercado pago porfavor tengo que comer !-->
        <button id="btn-logout"
            style="position: absolute; top: 10px; right: 10px; padding: 8px 15px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Cerrar
            sesión</button>

        <section>
            <h2>Carrito</h2>
            <div id="carrito-container"></div>
            <p id="total-carrito"></p>
            <button onclick="vaciarCarrito()">Vaciar carrito</button>
            <button onclick="finalizarCompra()">Finalizar compra</button>
        </section>

        <a id="btn-login" href="login.html">Iniciar sesion</a>
        <a id="btn-register" href="register.html">Registrarse</a>
        <a id="btn-contacto" href="contacto.html">Contacto</a>
        

    </header>
    <main>
        <section>
            <h2>Productos</h2>
            <div id="productos-container" style="display: flex; flex-wrap: wrap; gap: 20px;"></div>
        </section>
    </main>
    <footer>
        <h2>Lugares de atencion:</h2>
        <h4>Tafi viejo</h4>

        <h2>Sede Capital</h2>
        <iframe width="100%" height="100%" style="border:0" loading="lazy"
            src="https://www.google.com/maps/embed/v1/place?key=AIzaSyBAM2o7PiQqwk15LC1XRH2e_KJ-jUa7KYk&amp;zoom=15&amp;maptype=roadmap&amp;q=Don%20Bosco%20%26%20Coronel%20Manuel%20de%20Olaz%C3%A1bal"
            data-rocket-lazyload="fitvidscompatible"
            data-lazy-src="https://www.google.com/maps/embed/v1/place?key=AIzaSyBAM2o7PiQqwk15LC1XRH2e_KJ-jUa7KYk&amp;zoom=15&amp;maptype=roadmap&amp;q=Don%20Bosco%20%26%20Coronel%20Manuel%20de%20Olaz%C3%A1bal"
            class="lazyloaded" data-was-processed="true"></iframe>

        <h2>Sede Tafi viejo</h2>
        <iframe width="100%" height="100%" style="border:0" loading="lazy"
            src="https://www.google.com/maps/embed/v1/place?key=AIzaSyBAM2o7PiQqwk15LC1XRH2e_KJ-jUa7KYk&amp;zoom=16&amp;maptype=roadmap&amp;q=-26.771102%2C%20-65.243008"
            data-rocket-lazyload="fitvidscompatible"
            data-lazy-src="https://www.google.com/maps/embed/v1/place?key=AIzaSyBAM2o7PiQqwk15LC1XRH2e_KJ-jUa7KYk&amp;zoom=16&amp;maptype=roadmap&amp;q=-26.771102%2C%20-65.243008"
            class="lazyloaded" data-was-processed="true"></iframe>
    </footer>

    <script>
        const btnLogout = document.getElementById('btn-logout');
        const token = localStorage.getItem('token');

        if (!token) {
            btnLogout.style.display = 'none';
        }

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('usuario');
            window.location.href = 'login.html';
        });
    </script>
    <script src="./productos.js"></script>
</body>

</html>
