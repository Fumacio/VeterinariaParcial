<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Veterinaria TucuPet</title>
    <link rel="stylesheet" href="./login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.18.0/dist/axios.min.js"></script>
</head>
<body class="body">
    <header class="header">
        <h1>Veterinaria TucuPet</h1>
        <h2>Registrarse</h2>
    </header>

    <main class="main">
        <form class="login-form" id="form-registro">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="" required>
            <br>
            
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="" required>
            <br>
            
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" placeholder="" required>
            <br>
            
            <button type="submit" class="btn btn-primary">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; Todos los Derechos reservados 2026</p>
    </footer>

    <script src="./register.js"></script>
</body>
</html>
